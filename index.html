<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d0f"><title>Trail Coach 2.7</title>
<style>html,body{margin:0;background:#0b0d0f;color:#f2f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.small{font-size:13px;color:#8e9aa5;margin-top:8px}</style>
</head><body><div id="boot"><div><strong>Trail Coach</strong><div class="small">Laddar v2.7…</div></div></div>
<script>
(async()=>{
 try{
  const parts=["./tc27/index.part00","./tc27/index.part01","./tc27/index.part02","./tc27/index.part03","./tc27/index.part04","./tc27/index.part05","./tc27/index.part06","./tc27/index.part07","./tc27/index.part08","./tc27/index.part09","./tc27/index.part10","./tc27/index.part11","./tc27/index.part12","./tc27/index.part13","./tc27/index.part14","./tc27/index.part15","./tc27/index.part16"];
  const chunks=await Promise.all(parts.map(async p=>{
    const r=await fetch(p+'?v=2703',{cache:'no-store'});
    if(!r.ok)throw new Error(p+' HTTP '+r.status);
    const raw=await r.text();
    const clean=raw.replace(/[^A-Za-z0-9+/=]/g,'');
    if(!clean)throw new Error(p+' är tom efter Base64-sanering');
    if(clean.length%4!==0)throw new Error(p+' har ogiltig Base64-längd '+clean.length);
    let bin;
    try{bin=atob(clean)}catch(err){throw new Error(p+' kunde inte Base64-avkodas: '+(err.message||err));}
    const u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    return u8;
  }));
  const total=chunks.reduce((n,c)=>n+c.length,0);
  const u8=new Uint8Array(total);let off=0;
  for(const c of chunks){u8.set(c,off);off+=c.length;}
  if(u8.length<2||u8[0]!==0x1f||u8[1]!==0x8b)throw new Error('Payload kunde inte avkodas korrekt: gzip-header saknas.');
  if(typeof DecompressionStream==='undefined')throw new Error('Din webbläsare saknar gzip-stöd som krävs av denna installation.');
  let html;
  try{
    const ds=new DecompressionStream('gzip');
    html=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text();
  }catch(err){throw new Error('Gzip-payloaden är skadad eller ofullständig: '+(err.message||err));}
  if(!html||!/<html[\s>]/i.test(html))throw new Error('Payload packades upp men innehåller inte giltig Trail Coach HTML.');
  document.open();document.write(html);document.close();
 }catch(e){const b=document.getElementById('boot');if(b)b.innerHTML='<div><strong>Kunde inte ladda Trail Coach 2.7</strong><div class="small">'+String(e.message||e)+'</div></div>';console.error(e)}
})();
</script></body></html>
