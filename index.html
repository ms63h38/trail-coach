<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Trail Coach 2.5</title>
<style>html,body{margin:0;background:#09090b;color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:420px}.v{font-size:12px;color:#8b919b;margin-top:8px}</style>
</head>
<body>
<div id="boot"><div class="box"><strong>Trail Coach</strong><div class="v">Laddar v2.5.0…</div></div></div>
<script>
(async()=>{
  try{
    const r=await fetch('./base.html?tc=250',{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let text=await r.text();
    text=text
      .replaceAll('Trail Coach 2.3.1','Trail Coach 2.5')
      .replaceAll('APP_VERSION="2.3.1"','APP_VERSION="2.5.0"')
      .replaceAll('APP_BUILD="2026-09-03"','APP_BUILD="2026-09-06"')
      .replaceAll('>v2.3.1<','>v2.5<')
      .replaceAll('>2.3.1<','>2.5.0<');
    if(!text.includes('app-2.5.css'))text=text.replace('</head>','<link rel="stylesheet" href="./app-2.5.css?v=250"></head>');
    if(!text.includes('v25-core.js')){
      const s='<script src="./v25-core.js?v=250"><\/script><script src="./v25-strength.js?v=250"><\/script><script src="./v25-plan.js?v=250"><\/script><script src="./v25-vo2.js?v=250"><\/script>';
      text=text.replace('</body>',s+'</body>');
    }
    document.open();document.write(text);document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<div class="box"><strong>Kunde inte ladda Trail Coach 2.5</strong><div class="v">'+String(e.message||e)+'</div></div>';
  }
})();
</script>
</body>
</html>
