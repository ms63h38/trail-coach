<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d0f"><title>Trail Coach 2.7</title>
<style>html,body{margin:0;background:#0b0d0f;color:#f2f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.small{font-size:13px;color:#8e9aa5;margin-top:8px}</style>
</head><body><div id="boot"><div><strong>Trail Coach</strong><div class="small">Laddar v2.7…</div></div></div>
<script>
(async()=>{
 try{
  const parts=["./tc27/index.part00", "./tc27/index.part01", "./tc27/index.part02", "./tc27/index.part03", "./tc27/index.part04", "./tc27/index.part05", "./tc27/index.part06", "./tc27/index.part07", "./tc27/index.part08", "./tc27/index.part09", "./tc27/index.part10", "./tc27/index.part11", "./tc27/index.part12", "./tc27/index.part13", "./tc27/index.part14", "./tc27/index.part15", "./tc27/index.part16"];
  const texts=await Promise.all(parts.map(async p=>{const r=await fetch(p+'?v=2701',{cache:'no-store'});if(!r.ok)throw new Error(p+' HTTP '+r.status);return r.text()}));
  const b64=texts.join('').replace(/\s+/g,'');
  const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==='undefined')throw new Error('Din webbläsare saknar gzip-stöd som krävs av denna installation.');
  const ds=new DecompressionStream('gzip');
  const html=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text();
  document.open();document.write(html);document.close();
 }catch(e){const b=document.getElementById('boot');if(b)b.innerHTML='<div><strong>Kunde inte ladda Trail Coach 2.7</strong><div class="small">'+String(e.message||e)+'</div></div>';console.error(e)}
})();
</script></body></html>
